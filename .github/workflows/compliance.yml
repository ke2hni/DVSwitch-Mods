name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run repository compliance check
        run: bash tests/check-repository-compliance.sh
      - name: Run legacy combined-installer tests
        run: bash tests/test-installer.sh
      - name: Run MMDVM binary patcher tests
        run: python3 tests/test-mmdvm-binary-patcher.py
      - name: Run standalone MMDVM spacing tests
        run: bash tests/test-repair-mmdvm-spacing.sh
      - name: Run TXT updater patcher tests
        run: python3 tests/test-dvswitch-txt-updater-patcher.py
      - name: Run standalone TXT updater tests
        run: bash tests/test-repair-dvswitch-txt-updater.sh
      - name: Run legacy P25/NXDN patcher tests
        run: python3 tests/test-p25-nxdn-patcher.py
      - name: Run transaction tests
        run: bash tests/test-transaction.sh
